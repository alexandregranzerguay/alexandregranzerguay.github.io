# Research outputs, listed newest first by `date` (YYYY-MM; the year shown is its first four digits).
# Disclosure rule:
#   listed: false -> not shown anywhere
#   public: false -> title, authors, year, status and talks only; abstract, venue and links are never rendered
#   public: true  -> abstract, links, BibTeX and a /research/<slug>/ page
#   resume: false -> left off the one-page résumé (still on the site and the academic CV)
#   selected: true -> shown on the home page (keep it to about three)
#   scope: short description for unpublished work, shown in place of an abstract
# type is article, thesis or patent. Patents are listed separately and get no paper page.
# status is a position on a non-convex landscape:
#   initialized  = in preparation         (start)
#   descending   = working paper          (on the way down)
#   kkt          = under review           (resting in a local minimum while someone checks the KKT conditions)
#   backtracking = revise and resubmit    (climbing out over the hump)
#   converged    = published, or thesis completed (global minimum)

