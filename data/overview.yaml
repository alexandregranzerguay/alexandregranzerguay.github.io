# Research preamble. Each item is one paragraph. Shown on /research/ and in the Markdown profile,
# llms.txt and llms-full.txt. Keep the prose broad; specific terms (MIQP, MISOCP, ...) live in
# cv.yaml knows_about and llms.txt.
paragraphs:
  - >-
    My research focuses on the formulation and solution of computationally challenging portfolio
    optimization problems. I am particularly interested in problems where discrete investment
    decisions, non-convexities, and multi-period dependencies make optimization difficult to solve
    efficiently, especially at scale.
  - >-
    I develop and evaluate structure-exploiting solution methods, including decomposition algorithms
    such as ADMM, and investigate exact mixed-integer approaches alongside heuristics based on
    relaxation, sequential convex programming, and local search. My work examines the trade-offs
    between computational efficiency, solution quality, and practical portfolio implementation
    constraints.
  - >-
    Applications include equity and fixed-income index tracking, cardinality-constrained risk parity,
    trade optimization, and multi-period portfolio management.
