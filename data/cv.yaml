person:
  name: Alexandre Granzer-Guay
  alternate_names: [Alexandre Granzer Guay, Alex Granzer-Guay]
  headline: Quantitative researcher working on large-scale and non-convex portfolio optimization problems
  bio: >-
    PhD candidate in Operations Research (University of Toronto) and Quantitative Researcher at CIBC Global Asset Management.
    My research develops scalable, structure-exploiting optimization methods for portfolio construction,
    with a focus on cardinality-constrained, multi-period (model predictive control) and non-convex problems.
    I design and apply decomposition methods based on ADMM, structure-aware formulations and specialized
    branch-and-bound algorithms that make these problems tractable at institutional scale.
    Applications include risk parity and risk-budgeting portfolios as well as multi-period index tracking,
    and I have applied these methods to fixed-income, equity and multi-asset portfolios.
    More broadly, I enjoy building decision-making systems that turn complex, constrained problems into practical solutions.
  summary: >-
    Quantitative Researcher at CIBC Global Asset Management and PhD candidate in
    large-scale and non-convex portfolio optimization at the University of Toronto.
  location: Toronto, Canada
  email: alexandre.granzerguay@mail.utoronto.ca  # PDFs only; the website shows email_display
  email_display: alexandre (dot) granzerguay (at) mail (dot) utoronto (dot) ca
  url: https://alexandregranzerguay.github.io
  job_title: Quantitative Researcher
  employer: {name: CIBC Global Asset Management, short: CIBC Global Asset Management, url: https://www.cibc.com}
  affiliation: {name: University of Toronto, unit: Department of Mechanical and Industrial Engineering, url: https://www.mie.utoronto.ca}
  knows_about:
    - Portfolio optimization
    - Mixed-integer conic optimization
    - Risk parity
    - Risk budgeting
    - Branch-and-bound
    - Alternating direction method of multipliers (ADMM)
    - Model predictive control
    - Fixed-income index tracking
    - Operations research

